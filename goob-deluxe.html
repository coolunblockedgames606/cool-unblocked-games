<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Tower Defense Deluxe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Segoe UI,sans-serif;background:#07152c;color:#fff}button{font:inherit;font-weight:900;cursor:pointer;border:0}.hidden{display:none!important}.screen{position:fixed;inset:0;display:grid;place-items:center;z-index:30}.menu{background:linear-gradient(#76e9ff,#6b9cff 48%,#23356f);overflow:hidden}.menu:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#fff9 0 3px,transparent 4px),radial-gradient(circle at 80% 25%,#fff8 0 2px,transparent 3px);background-size:170px 130px;opacity:.7}.sun{position:absolute;width:260px;height:260px;border-radius:50%;background:#ffe875;box-shadow:0 0 80px #fff6;top:-70px;right:8%}.mountains{position:absolute;bottom:-80px;width:120%;height:300px;left:-10%;background:linear-gradient(145deg,#345f82,#1b345b);clip-path:polygon(0 80%,18% 35%,32% 68%,49% 18%,64% 67%,82% 30%,100% 75%,100% 100%,0 100%);transform:perspective(700px) rotateX(8deg)}.island{position:absolute;width:min(850px,82vw);height:360px;bottom:7%;left:50%;transform:translateX(-50%) perspective(700px) rotateX(58deg) rotateZ(-2deg);background:linear-gradient(#71d879,#278b55);border:8px solid #174d50;border-radius:48%;box-shadow:0 45px 0 #162c52,0 65px 70px #0007}.path3d{position:absolute;left:9%;right:9%;top:43%;height:74px;background:#e7c477;border:8px solid #b57d49;border-radius:50%;box-shadow:inset 0 12px #fff4}.menuTitle{position:relative;text-align:center;z-index:5;margin-top:-210px;text-shadow:0 7px 0 #28508b,0 12px 30px #0007}.menuTitle h1{font-size:clamp(48px,8vw,94px);line-height:.9;margin:0;color:#fff;letter-spacing:-4px}.menuTitle h1 b{color:#ff5f96}.menuTitle p{font-size:18px;font-weight:800}.play{font-size:27px;padding:16px 74px;border-radius:18px;background:linear-gradient(#ffe86b,#ffb72d);color:#573300;box-shadow:0 8px 0 #b56e18,0 15px 30px #0005;transition:.18s}.play:hover{transform:translateY(-4px) scale(1.03)}.play:active{transform:translateY(5px);box-shadow:0 3px 0 #b56e18}.goob{position:absolute;width:78px;height:78px;border-radius:48% 48% 42% 42%;background:linear-gradient(145deg,#7ceaff,#3474d8);border:5px solid #173e75;box-shadow:inset 10px 8px #fff7,0 14px 0 #17304f;z-index:6}.goob:before,.goob:after{content:"";position:absolute;top:24px;width:13px;height:18px;border-radius:50%;background:#fff;border:3px solid #173e75}.goob:before{left:17px}.goob:after{right:17px}.goob i{position:absolute;left:31px;top:34px;width:17px;height:8px;border-bottom:4px solid #173e75;border-radius:50%}.g1{left:12%;bottom:24%;transform:rotate(-8deg) scale(.9)}.g2{left:28%;bottom:33%;transform:rotate(5deg) scale(1.1);background:linear-gradient(145deg,#ffd66b,#e36c38)}.g3{right:26%;bottom:30%;transform:rotate(-5deg) scale(1.05);background:linear-gradient(145deg,#a9ff79,#38a95b)}.g4{right:11%;bottom:22%;transform:rotate(8deg) scale(.88);background:linear-gradient(145deg,#f5a7ff,#7e55cf)}.bob{animation:bob 2.4s ease-in-out infinite}.g2{animation:bob 2.1s .3s ease-in-out infinite}.g3{animation:bob 2.6s .5s ease-in-out infinite}.g4{animation:bob 2.2s .8s ease-in-out infinite}@keyframes bob{50%{translate:0 -13px;rotate:3deg}}.playAnim .goob{animation:jump .8s cubic-bezier(.2,.8,.3,1) forwards}.playAnim .g1{animation-delay:0s}.playAnim .g2{animation-delay:.08s}.playAnim .g3{animation-delay:.16s}.playAnim .g4{animation-delay:.24s}@keyframes jump{50%{translate:0 -100px;rotate:15deg}100%{translate:0 260px;opacity:0}}
#mapscreen{background:linear-gradient(#4ddcff,#3155b7);overflow:auto;padding:30px}.mapCard{width:min(1050px,94vw);padding:24px;border:5px solid #ffe15a;border-radius:28px;background:#eafaff;color:#17345d;box-shadow:0 18px 0 #17265f}.mapCard h2{text-align:center;font-size:42px;margin:0}.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.map{position:relative;height:150px;border-radius:20px;padding:16px;text-align:left;color:#fff;border:4px solid #fff;overflow:hidden;box-shadow:0 10px 0 #17265f55;transition:.2s;transform:perspective(500px) rotateX(7deg)}.map:hover{transform:perspective(500px) rotateX(0) translateY(-6px)}.map:before{content:"";position:absolute;inset:35% -10% 15%;border-radius:50%;background:#e6bd63;transform:rotate(-8deg);opacity:.9}.map b,.map span{position:relative;z-index:2}.map b{font-size:22px;text-shadow:0 2px 4px #0008}.map span{display:block;font-size:12px;margin-top:6px}.garden{background:linear-gradient(#5de184,#2678a8)}.candy{background:linear-gradient(#ff8dc6,#b74f8f)}.space{background:linear-gradient(#31227d,#111c48)}.volcano{background:linear-gradient(#e85c3f,#682b35)}.cloud{background:linear-gradient(#9beaff,#6d89e8)}.neon{background:linear-gradient(#182c72,#b73f9c)}.diff{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.diff button{padding:12px;border-radius:12px;background:#d9eaff;color:#17345d}.diff button:hover{background:#ffe45f}.game{height:100vh;display:grid;grid-template-rows:60px}.top{height:60px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0c3154;border-bottom:3px solid #2a79a7}.logo{font-size:20px}.logo b{color:#ff5b91}.pill{padding:6px 9px;border-radius:10px;background:#061b37;border:2px solid #28608c}.spacer{flex:1}.top button{padding:7px 11px;border-radius:9px;background:#ffe05a}.layout{height:calc(100vh - 60px);display:grid;grid-template-columns:220px 1fr 245px}.side{overflow:auto;padding:9px;background:#0d3659;border-right:3px solid #1b5a84}.right{border-left:3px solid #1b5a84;border-right:0}.tower{width:100%;display:grid;grid-template-columns:40px 1fr;gap:7px;align-items:center;text-align:left;margin:4px 0;padding:6px;border-radius:11px;background:#21618b;color:#fff;border:2px solid #4fb9dd}.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#8ceaff;font-size:20px}.small{font-size:10px;color:#c9edff}.board{position:relative;min-width:0;min-height:0}.board canvas{width:100%;height:100%;display:block}.box{background:#103b61;border:2px solid #2d76a4;border-radius:13px;padding:9px;margin-bottom:9px}.box button{width:100%;margin-top:6px;padding:8px;border-radius:9px;background:#2b8db9;color:#fff}.gold{background:#ffd447!important;color:#593500!important}.bar{height:8px;background:#06182d;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#76ff92}.xp{color:#7dffb1}@media(max-width:850px){.layout{grid-template-columns:170px 1fr}.right{display:none}.maps{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.layout{grid-template-columns:130px 1fr}.logo{display:none}.pill{font-size:11px}.maps{grid-template-columns:1fr}.diff{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="title" class="screen menu"><div class="sun"></div><div class="mountains"></div><div class="island"><div class="path3d"></div></div><div class="goob g1 bob"><i></i></div><div class="goob g2"><i></i></div><div class="goob g3"><i></i></div><div class="goob g4"><i></i></div><div class="menuTitle"><h1>GOOB <b>TOWER<br>DEFENSE</b></h1><p>DELUXE • 25 DEFENDERS • 6 WORLDS</p><button class="play" id="play">PLAY</button></div></div><div id="mapscreen" class="screen hidden"><div class="mapCard"><h2>CHOOSE YOUR WORLD</h2><p style="text-align:center">Pick a 3D-style Goob island and difficulty.</p><div class="maps" id="maps"></div><div id="diffs"></div></div></div><div id="game" class="hidden"><header class="top"><div class="logo">GOOB <b>TOWER DEFENSE</b></div><div class="pill">💰 <span id="money">900</span></div><div class="pill">❤️ <span id="lives">100</span></div><div class="pill">WAVE <span id="wave">0</span></div><div class="pill">XP <span id="xp">0</span></div><div class="spacer"></div><button id="pause">Ⅱ</button><button id="speed">1×</button><button onclick="location.reload()">↻</button></header><div class="layout"><aside class="side"><h3>DEFENDERS</h3><div id="towers"></div></aside><main class="board"><canvas id="cv"></canvas></main><aside class="side right"><div class="box"><h3>GOOB LAB</h3><div id="selected">Select a defender.</div></div><div class="box"><h3>WAVE CONTROL</h3><button id="start" class="gold">Launch Wave 1</button><p style="font-size:11px">Boss waves every 10 rounds.</p></div><div class="box"><h3>PROGRESSION</h3><div id="progress"></div></div></aside></div></div><script>(()=>{const $=id=>document.getElementById(id),C=$("cv"),g=C.getContext("2d",{alpha:false}),names=["Sprout","Bubble","Boomer","Punch","Dart","Cannon","Rocket","Bomb","Firework","Meteor","Frost","Zap","Sun","Rainbow","Crystal","Magnet","Medic","Builder","DJ","Time","Gear","Shield","Laser","Portal","Star"],icons=["🌱","🫧","🪃","🥊","🎯","💣","🚀","💥","🎆","☄️","❄️","⚡","☀️","🌈","💎","🧲","💗","🔧","🎵","⌛","⚙️","🛡️","🔦","🌀","⭐"],MAPS={garden:["Goob Garden","#4abd70","#e6bd63"],candy:["Sugar Speedway","#ed76b5","#ffe48a"],space:["Goob Galaxy","#35248d","#6ce9ff"],volcano:["Magma Falls","#963b30","#ffd05b"],cloud:["Cloud Kingdom","#75dcff","#fff1c8"],neon:["Neon City","#17255f","#ff61d2"]},PATHS={garden:[[0,.7],[.15,.7],[.15,.3],[.4,.3],[.4,.72],[.62,.72],[.62,.4],[.83,.4],[.83,.64],[1,.64]],candy:[[0,.34],[.2,.34],[.2,.7],[.4,.7],[.4,.22],[.62,.22],[.62,.58],[.8,.58],[.8,.36],[1,.36]],space:[[0,.62],[.18,.62],[.18,.25],[.38,.25],[.38,.78],[.58,.78],[.58,.35],[.78,.35],[.78,.65],[1,.65]],volcano:[[0,.26],[.2,.26],[.2,.65],[.37,.65],[.37,.2],[.58,.2],[.58,.7],[.78,.7],[.78,.4],[1,.4]],cloud:[[0,.72],[.16,.72],[.16,.35],[.35,.35],[.35,.65],[.55,.65],[.55,.25],[.76,.25],[.76,.58],[1,.58]],neon:[[0,.42],[.18,.42],[.18,.72],[.38,.72],[.38,.25],[.58,.25],[.58,.65],[.8,.65],[.8,.38],[1,.38]]},DIFF={Easy:[.7,.8,1],Normal:[1,1,1.2],Hard:[1.35,1.18,1.55],Expert:[1.8,1.38,2]};let W=800,H=600,map="garden",difficulty="Normal",money=900,lives=100,wave=0,running=false,paused=false,mult=1,placing=-1,selected=null,towers=[],enemies=[],shots=[],profileXP=0,last=performance.now();const data=names.map((n,i)=>({name:n+" Goob",icon:icons[i],cost:80+i*35,damage:10+i*6,range:100+(i%6)*20,rate:.45+(i%5)*.16,color:["#50d66f","#50cfff","#ff9c52","#ff6686","#698cff","#b47cff"][i%6],level:0,xp:0}));function resize(){const r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);W=Math.max(1,r.width);H=Math.max(1,r.height);C.width=Math.floor(W*d);C.height=Math.floor(H*d);g.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);function points(){return PATHS[map].map(p=>({x:p[0]*W,y:p[1]*H}))}function roadDist(x,y){const p=points();let best=1e9;for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1))),qx=a.x+t*dx,qy=a.y+t*dy;best=Math.min(best,Math.hypot(x-qx,y-qy))}return best}function draw(){const m=MAPS[map],p=points();g.fillStyle=m[1];g.fillRect(0,0,W,H);for(let i=0;i<60;i++){g.fillStyle=i%3?"#fff2":"#0002";g.beginPath();g.arc((i*137)%W,(i*71)%H,2,0,7);g.fill()}g.lineCap="round";g.lineJoin="round";for(const [width,color] of [[76,"#0004"],[58,m[2]]]){g.lineWidth=width;g.strokeStyle=color;g.beginPath();p.forEach((a,i)=>i?g.lineTo(a.x,a.y):g.moveTo(a.x,a.y));g.stroke()}g.lineWidth=3;g.strokeStyle="#fff9";g.setLineDash([14,12]);g.beginPath();p.forEach((a,i)=>i?g.lineTo(a.x,a.y):g.moveTo(a.x,a.y));g.stroke();g.setLineDash([]);for(const t of towers){if(selected===t){g.beginPath();g.arc(t.x,t.y,t.range,0,7);g.fillStyle="#7df6ff18";g.fill()}g.beginPath();g.arc(t.x,t.y+6,20,0,7);g.fillStyle="#173b55";g.fill();g.beginPath();g.arc(t.x,t.y,19,0,7);g.fillStyle=t.color;g.fill();g.strokeStyle="#173b55";g.lineWidth=4;g.stroke();g.font="20px serif";g.textAlign="center";g.textBaseline="middle";g.fillText(t.icon,t.x,t.y)}for(const e of enemies){g.beginPath();g.ellipse(e.x,e.y,21,15,0,0,7);g.fillStyle=e.color;g.fill();g.strokeStyle="#702344";g.lineWidth=4;g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(e.x-7,e.y-3,4,0,7);g.arc(e.x+7,e.y-3,4,0,7);g.fill();g.fillStyle="#39203b";g.beginPath();g.arc(e.x-6,e.y-3,2,0,7);g.arc(e.x+8,e.y-3,2,0,7);g.fill();g.fillStyle="#0005";g.fillRect(e.x-21,e.y-25,42,6);g.fillStyle="#61ff8b";g.fillRect(e.x-21,e.y-25,42*Math.max(0,e.hp/e.max),6)}for(const s of shots){g.beginPath();g.arc(s.x,s.y,5,0,7);g.fillStyle=s.color;g.fill()}}function spawn(){const p=points(),d=DIFF[difficulty],boss=wave%10===0&&enemies.length===0,hp=(40+wave*14+(boss?wave*25:0))*d[0];enemies.push({x:p[0].x,y:p[0].y,i:0,hp,max:hp,spd:(72+wave*3.4)*d[1]*(boss?.62:1),color:boss?"#ffd13d":["#ff587a","#54dcff","#9cff62","#c58cff","#ff944d"][wave%5],boss})}function tick(dt){if(!running||paused)return;if(Math.random()<dt*Math.min(2.5,1+wave/10))spawn();const p=points();for(const e of enemies){if(e.i>=p.length-1){e.dead=true;lives-=e.boss?12:2;continue}const q=p[e.i+1],dx=q.x-e.x,dy=q.y-e.y,d=Math.hypot(dx,dy);if(d<4)e.i++;else{e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt}}for(const t of towers){t.cool=(t.cool||0)-dt;if(t.cool<=0){const e=enemies.find(v=>!v.dead&&Math.hypot(v.x-t.x,v.y-t.y)<=t.range);if(e){shots.push({x:t.x,y:t.y,target:e,damage:t.damage*(1+t.level*.25),color:t.color,spd:450});t.cool=t.rate*Math.pow(.9,t.level)}}}for(const s of shots){if(!s.target||s.target.dead){s.dead=true;continue}const dx=s.target.x-s.x,dy=s.target.y-s.y,d=Math.hypot(dx,dy),v=s.spd*dt;if(d<=v){s.target.hp-=s.damage;s.dead=true;if(s.target.hp<=0){s.target.dead=true;money+=Math.floor((s.target.boss?150:10)*DIFF[difficulty][2]);profileXP+=5+(s.target.boss?30:0)}}else{s.x+=dx/d*v;s.y+=dy/d*v}}enemies=enemies.filter(e=>!e.dead);shots=shots.filter(s=>!s.dead);if(running&&enemies.length===0&&wave>0&&Math.random()<dt*.7)running=false;$("money").textContent=Math.floor(money);$("lives").textContent=lives;$("wave").textContent=wave;$("xp").textContent=Math.floor(profileXP);renderSelected();if(lives<=0){alert("The Goob base was overrun!");location.reload()}}function loop(now){const dt=Math.min(.04,(now-last)/1000)*mult;last=now;tick(dt);draw();requestAnimationFrame(loop)}function buildTowers(){const el=$("towers");el.textContent="";data.forEach((d,i)=>{const b=document.createElement("button");b.className="tower";b.innerHTML='<span class="ico">'+d.icon+'</span><span><b>'+d.name+'</b><div class="small">Tier '+d.level+'/5 • $'+d.cost+'</div></span>';b.onclick=()=>{if(money>=d.cost)placing=i};el.appendChild(b)})}function renderSelected(){const el=$("selected");if(!selected){el.textContent="Select a defender.";return}const d=data[selected.id],need=30+d.level*60;el.innerHTML='<b>'+d.name+'</b><p>Tier '+d.level+'/5</p><div class="bar"><i style="width:'+Math.min(100,d.xp/need*100)+'%"></i></div><p class="xp">XP '+Math.floor(d.xp)+' / '+need+'</p><button onclick="upgrade()">Upgrade Tier</button>';$('progress').innerHTML='<b>Profile XP:</b> '+Math.floor(profileXP)+'<p class="xp">Using towers earns XP.</p>'}window.upgrade=()=>{if(!selected)return;const d=data[selected.id],cost=100+d.level*150;if(d.level<5&&money>=cost){money-=cost;d.level++;renderSelected();buildTowers()}};C.addEventListener("click",e=>{const r=C.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(placing>=0){const d=data[placing];if(money>=d.cost&&roadDist(x,y)>45&&!towers.some(t=>Math.hypot(t.x-x,t.y-y)<40)){money-=d.cost;towers.push({x,y,id:placing,icon:d.icon,color:d.color,damage:d.damage,range:d.range,rate:d.rate,level:d.level});d.xp+=5;placing=-1;buildTowers()}return}selected=towers.find(t=>Math.hypot(t.x-x,t.y-y)<25)||null;renderSelected()});$("start").onclick=()=>{if(!running){wave++;running=true}};$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ"};$("speed").onclick=()=>{mult=mult===1?1.5:mult===1.5?2:1;$("speed").textContent=mult+"×"};let chosen=null;Object.entries(MAPS).forEach(([k,v])=>{const b=document.createElement("button");b.className="map "+k;b.innerHTML='<b>'+v[0]+'</b><span>Explore this Goob world</span>';b.onclick=()=>{chosen=k;const d=$("diffs");d.innerHTML='<div class="diff"></div>';Object.keys(DIFF).forEach(q=>{const z=document.createElement("button");z.textContent=q;z.onclick=()=>{map=chosen;difficulty=q;$("mapscreen").classList.add("hidden");$("game").classList.remove("hidden");resize();requestAnimationFrame(loop)};d.firstChild.appendChild(z)})};$("maps").appendChild(b)});$("play").onclick=()=>{const t=$("title");t.classList.add("playAnim");setTimeout(()=>{$("mapscreen").classList.remove("hidden");t.classList.add("hidden")},700)};buildTowers();renderSelected();resize()})();</script></body></html>
