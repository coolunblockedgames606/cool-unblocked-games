<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Meadow 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#7bcdf0;font-family:Arial;color:#fff}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}.stats{display:flex;gap:8px;padding:14px}.box{background:#10243ddd;border:2px solid #ffffff22;border-radius:12px;padding:9px 13px;font-weight:900}.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;background:#10243dee;padding:25px;border-radius:18px;pointer-events:auto}.center h1{margin:0 0 8px;font-size:40px}.center p{margin:6px 0 18px}.btn{border:0;border-radius:12px;background:#ffd34d;padding:13px 25px;font-weight:1000;font-size:17px;cursor:pointer}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}.status{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-weight:1000;font-size:25px}.help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#10243ddd;padding:8px 12px;border-radius:10px}#fire{position:absolute;right:20px;bottom:20px;border-radius:50%;width:86px;height:86px;padding:0;pointer-events:auto}.hidden{display:none}</style></head><body><div id="ui"><div class="stats"><div class="box">💰 $<span id="cash">0</span></div><div class="box">❤️ <span id="hp">10</span></div><div class="box">🌊 Wave <span id="wave">0</span></div><div class="box">🎈 <span id="count">0</span></div></div><div class="cross">+</div><div class="status" id="status">GOOB MEADOW</div><div class="center" id="menu"><h1>GOOB MEADOW 3D</h1><p>Walk through the meadow and pop the balloons.</p><button class="btn" id="play">ENTER MEADOW</button></div><button class="btn hidden" id="start">START WAVE</button><button class="btn hidden" id="fire">DART</button><div class="help hidden" id="help">WASD = walk • Mouse = look • Click / Space = dart • Esc = release mouse</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x7bcdf0);scene.fog=new THREE.Fog(0x7bcdf0,35,120);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);camera.position.set(0,2,14);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe9faff,0x315d38,2));const sun=new THREE.DirectionalLight(0xfff2cf,3);sun.position.set(-30,40,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({color:0x65b950,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const roadPts=[new THREE.Vector3(-48,.05,-28),new THREE.Vector3(-25,.05,-28),new THREE.Vector3(-25,.05,-10),new THREE.Vector3(20,.05,-10),new THREE.Vector3(20,.05,10),new THREE.Vector3(-25,.05,10),new THREE.Vector3(-25,.05,30),new THREE.Vector3(48,.05,30)];const curve=new THREE.CatmullRomCurve3(roadPts);const road=new THREE.Mesh(new THREE.TubeGeometry(curve,160,3.2,16,false),new THREE.MeshStandardMaterial({color:0xb98a55,roughness:1}));road.receiveShadow=true;scene.add(road);
function tree(x,z){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,3,8),new THREE.MeshStandardMaterial({color:0x75482d}));t.position.y=1.5;const c=new THREE.Mesh(new THREE.SphereGeometry(2.1,14,10),new THREE.MeshStandardMaterial({color:0x23723b,roughness:1}));c.position.y=3.4;g.add(t,c);g.position.set(x,0,z);g.traverse(o=>o.castShadow=true);scene.add(g)}for(let i=0;i<45;i++){let x=(Math.random()-.5)*115,z=(Math.random()-.5)*105;if(Math.abs(x)<13&&Math.abs(z)<42){i--;continue}tree(x,z)}
for(let i=0;i<35;i++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*.7),new THREE.MeshStandardMaterial({color:0x777b6b,roughness:1}));r.position.set((Math.random()-.5)*115,.5,(Math.random()-.5)*105);r.castShadow=true;scene.add(r)}
// Original seated upgrade NPC
const npc=new THREE.Group();const seat=new THREE.Mesh(new THREE.BoxGeometry(2.4,1,2),new THREE.MeshStandardMaterial({color:0x4a3324}));seat.position.y=.5;npc.add(seat);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.2,8,16),new THREE.MeshStandardMaterial({color:0x3e74bd}));body.position.y=2;npc.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.7,16,12),new THREE.MeshStandardMaterial({color:0xd99b67}));head.position.y=3.2;npc.add(head);npc.position.set(6,0,2);npc.traverse(o=>o.castShadow=true);scene.add(npc);
let wave=0,cash=0,hp=10,active=false,spawnLeft=0,spawnClock=0,balloons=[],darts=[],playing=false;const balloonColors=[0xf04e68,0x4da8ff,0xffd34d,0x58d67c];function makeBalloon(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.75,20,16),new THREE.MeshStandardMaterial({color:balloonColors[Math.floor(Math.random()*4)],roughness:.35}));b.scale.set(.82,1.12,.82);b.castShadow=true;g.add(b);const knot=new THREE.Mesh(new THREE.ConeGeometry(.12,.25,8),new THREE.MeshStandardMaterial({color:0x444}));knot.position.y=-.85;g.add(knot);const s=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.9,6),new THREE.MeshStandardMaterial({color:0xffffff}));s.position.y=-1.3;g.add(s);g.userData={t:0,hp:1};return g}function pathPoint(t){return curve.getPoint(Math.max(0,Math.min(1,t)))}function spawn(){const b=makeBalloon();b.position.copy(pathPoint(0));b.position.y=3;scene.add(b);balloons.push(b)}
function dart(){if(!playing)return;const d=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.8,8),new THREE.MeshStandardMaterial({color:0x704321}));d.position.copy(camera.position);d.quaternion.copy(camera.quaternion);d.rotateX(Math.PI/2);d.userData.vel=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(45);scene.add(d);darts.push(d)}function startWave(){if(active||!playing)return;wave++;active=true;spawnLeft=7+wave*3;spawnClock=0;document.getElementById('start').classList.add('hidden');document.getElementById('status').textContent='WAVE '+wave}document.getElementById('play').onclick=()=>{playing=true;document.getElementById('menu').classList.add('hidden');document.getElementById('start').classList.remove('hidden');document.getElementById('fire').classList.remove('hidden');document.getElementById('help').classList.remove('hidden');renderer.domElement.requestPointerLock()};document.getElementById('start').onclick=startWave;document.getElementById('fire').onclick=dart;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')dart()});addEventListener('keyup',e=>keys[e.code]=false);
let keys={},yaw=0,pitch=0,locked=false;document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);renderer.domElement.addEventListener('click',()=>{if(playing&&!locked)renderer.domElement.requestPointerLock();else if(locked)dart()});document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch));camera.rotation.set(pitch,yaw,0,'YXZ')});
const clock=new THREE.Clock();function update(dt){if(!playing)return;const move=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(move.length()){move.normalize();move.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(move,10*dt)}camera.position.x=Math.max(-60,Math.min(60,camera.position.x));camera.position.z=Math.max(-55,Math.min(55,camera.position.z));if(active&&spawnLeft>0){spawnClock-=dt;if(spawnClock<=0){spawn();spawnLeft--;spawnClock=.65}}for(const b of balloons){b.userData.t+=dt*(.045+wave*.003);b.position.copy(pathPoint(b.userData.t));b.position.y=3+Math.sin(clock.elapsedTime*4+b.userData.t*10)*.15}for(let i=balloons.length-1;i>=0;i--){const b=balloons[i];if(b.userData.t>=1){scene.remove(b);balloons.splice(i,1);hp--;if(hp<=0){active=false;document.getElementById('status').textContent='GAME OVER';document.getElementById('start').classList.remove('hidden');document.getElementById('start').textContent='RESTART WAVE';}}}for(let i=darts.length-1;i>=0;i--){const d=darts[i];d.position.addScaledVector(d.userData.vel,dt);let hit=false;for(let j=balloons.length-1;j>=0;j--){if(d.position.distanceTo(balloons[j].position)<.85){cash+=10;scene.remove(balloons[j]);balloons.splice(j,1);scene.remove(d);darts.splice(i,1);hit=true;break}}if(!hit&&d.position.distanceTo(camera.position)>80){scene.remove(d);darts.splice(i,1)}}if(active&&spawnLeft===0&&balloons.length===0){active=false;cash+=50+wave*10;document.getElementById('status').textContent='WAVE COMPLETE';document.getElementById('start').classList.remove('hidden');document.getElementById('start').textContent='START NEXT WAVE'}document.getElementById('cash').textContent=Math.floor(cash);document.getElementById('hp').textContent=hp;document.getElementById('wave').textContent=wave;document.getElementById('count').textContent=balloons.length}function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());update(dt);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
