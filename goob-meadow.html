<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Meadow</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79c9ef;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;cursor:crosshair}#ui{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000}.stats{display:flex;gap:8px;padding:14px;flex-wrap:wrap}.box{background:#10243ddd;border:2px solid #ffffff22;border-radius:12px;padding:9px 13px;font-weight:900}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}.title{font-size:42px;font-weight:1000}.hint{margin-top:8px;background:#10243ddd;padding:9px 13px;border-radius:10px}.cross{position:absolute;left:50%;top:50%;font-size:30px;transform:translate(-50%,-50%)}button{pointer-events:auto;border:0;border-radius:12px;background:#ffd34d;color:#382500;font-weight:1000;padding:14px 28px;font-size:18px;cursor:pointer;box-shadow:0 5px 15px #0005}#start{position:absolute;left:50%;bottom:30px;transform:translateX(-50%)}#fire{position:absolute;right:22px;bottom:22px;border-radius:50%;width:86px;height:86px;padding:0}#status{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:28px;font-weight:1000}#error{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#111d;padding:20px;border-radius:15px;text-align:center}</style></head><body><canvas id="game"></canvas><div id="ui"><div class="stats"><div class="box">💰 $<span id="cash">0</span></div><div class="box">❤️ <span id="hp">10</span></div><div class="box">🌊 Wave <span id="wave">0</span></div><div class="box">🎈 <span id="count">0</span></div></div><div class="cross">+</div><div id="status">GOOB MEADOW</div><div id="startWrap" class="center"><div class="title">GOOB MEADOW</div><div class="hint">Walk around the meadow and pop the balloons.</div></div><button id="start">START WAVE</button><button id="fire">POP!</button><div id="error">Your browser could not start the game.<br>Try refreshing the page.</div></div><script>
'use strict';
const c=document.getElementById('game'),x=c.getContext('2d');let W=0,H=0;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const world={w:100,h:100};let player={x:50,y:72,a:0};let keys={};let wave=0,cash=0,hp=10,active=false,spawnLeft=0,spawnClock=0,balloons=[],message='GOOB MEADOW',messageTime=0;const balloonsColors=['#f04e68','#4da8ff','#ffd34d','#58d67c'];
// Fixed meadow objects make the map visible and give the player landmarks.
const trees=[];for(let i=0;i<38;i++){let tx=8+Math.random()*84,ty=8+Math.random()*84;if(Math.hypot(tx-50,ty-55)<16){i--;continue}trees.push({x:tx,y:ty,s:.8+Math.random()*.7})}
const rocks=[];for(let i=0;i<22;i++)rocks.push({x:5+Math.random()*90,y:5+Math.random()*90,s:.5+Math.random()*.7});
const path=[{x:6,y:18},{x:25,y:18},{x:25,y:35},{x:75,y:35},{x:75,y:58},{x:25,y:58},{x:25,y:82},{x:94,y:82}];
function lerpPath(t){let n=path.length-1,z=t*n,i=Math.min(n-1,Math.floor(z)),f=z-i;return{x:path[i].x+(path[i+1].x-path[i].x)*f,y:path[i].y+(path[i+1].y-path[i].y)*f}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function startWave(){if(active)return;wave++;active=true;spawnLeft=6+wave*3;spawnClock=0;message='WAVE '+wave;messageTime=2;document.getElementById('start').style.display='none';document.getElementById('startWrap').style.display='none'}document.getElementById('start').onclick=startWave;
function pop(){if(!active)return;let best=null,bd=999;for(const b of balloons){const dx=b.x-player.x,dy=b.y-player.y,ang=Math.atan2(dy,dx);let d=Math.abs(Math.atan2(Math.sin(ang-player.a),Math.cos(ang-player.a)));let r=Math.hypot(dx,dy);if(d<.10 && r<55 && r<bd){best=b;bd=r}}if(best){best.dead=true;cash+=10;message='+$10';messageTime=.5}}
document.getElementById('fire').onclick=pop;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')pop()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dragging=false,lastX=0; c.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX});addEventListener('mouseup',()=>dragging=false);addEventListener('mousemove',e=>{if(dragging){player.a+=(e.clientX-lastX)*.006;lastX=e.clientX}});c.addEventListener('click',e=>{if(e.target===c&&!dragging){player.a+=(e.clientX-W/2)*.0008}});
function spawn(){const b=lerpPath(0);balloons.push({t:0,x:b.x,y:b.y,color:balloonsColors[Math.floor(Math.random()*4)],speed:.055+wave*.003,dead:false})}
function update(dt){const speed=18*dt;let dx=0,dy=0;if(keys.w)dy+=1;if(keys.s)dy-=1;if(keys.a)dx-=1;if(keys.d)dx+=1;const ca=Math.cos(player.a),sa=Math.sin(player.a);player.x+=((dx*ca-dy*sa)*speed);player.y+=((dx*sa+dy*ca)*speed);player.x=Math.max(3,Math.min(97,player.x));player.y=Math.max(3,Math.min(97,player.y));if(active&&spawnLeft>0){spawnClock-=dt;if(spawnClock<=0){spawn();spawnLeft--;spawnClock=.65}}for(const b of balloons){b.t+=b.speed*dt;const p=lerpPath(Math.min(1,b.t));b.x=p.x;b.y=p.y}for(let i=balloons.length-1;i>=0;i--){const b=balloons[i];if(b.dead||b.t>=1){if(b.t>=1&&!b.dead){hp--;message='A balloon got through!';messageTime=1;if(hp<=0){active=false;message='GAME OVER';document.getElementById('start').style.display='block';document.getElementById('start').textContent='PLAY AGAIN';document.getElementById('startWrap').style.display='none';wave=0}}balloons.splice(i,1)}}if(active&&spawnLeft===0&&balloons.length===0){active=false;cash+=50+wave*10;message='WAVE COMPLETE';messageTime=2;document.getElementById('start').style.display='block';document.getElementById('start').textContent='START NEXT WAVE'}if(messageTime>0)messageTime-=dt}
function project(wx,wy){let dx=wx-player.x,dy=wy-player.y;let forward=dx*Math.cos(player.a)+dy*Math.sin(player.a);let side=-dx*Math.sin(player.a)+dy*Math.cos(player.a);if(forward<=.1)return null;let f=520/forward;return{x:W/2+side*f,y:H*.52-(3/forward)*f,scale:Math.max(.2,Math.min(3,20/forward)),d:forward}}
function drawTree(o){const p=project(o.x,o.y);if(!p)return;x.fillStyle='#684126';x.fillRect(p.x-7*p.scale,p.y-45*p.scale,14*p.scale,45*p.scale);x.fillStyle='#26753e';x.beginPath();x.arc(p.x,p.y-58*p.scale,34*p.scale,0,Math.PI*2);x.fill();x.fillStyle='#31894a';x.beginPath();x.arc(p.x-22*p.scale,p.y-48*p.scale,22*p.scale,0,Math.PI*2);x.fill()}
function draw(){x.clearRect(0,0,W,H);const g=x.createLinearGradient(0,0,0,H*.65);g.addColorStop(0,'#78c9ef');g.addColorStop(1,'#d9f2ff');x.fillStyle=g;x.fillRect(0,0,W,H*.65);x.fillStyle='#65b94e';x.fillRect(0,H*.52,W,H*.48);x.fillStyle='#b98b55';x.beginPath();for(let i=0;i<path.length;i++){const p=project(path[i].x,path[i].y);if(p){if(i===0)x.moveTo(p.x,p.y);else x.lineTo(p.x,p.y)}}x.lineWidth=70;x.strokeStyle='#b98b55';x.stroke();const objs=trees.map(t=>({type:'tree',o:t})).concat(rocks.map(r=>({type:'rock',o:r}))).concat(balloons.map(b=>({type:'balloon',o:b})));objs.sort((a,b)=>{const pa=project(a.o.x,a.o.y),pb=project(b.o.x,b.o.y);return(pb?pb.d:0)-(pa?pa.d:0)});for(const q of objs){const p=project(q.o.x,q.o.y);if(!p)continue;if(q.type==='tree')drawTree(q.o);else if(q.type==='rock'){x.fillStyle='#777b6d';x.beginPath();x.ellipse(p.x,p.y,25*p.scale,14*p.scale,0,0,Math.PI*2);x.fill()}else{x.fillStyle=q.o.color;x.beginPath();x.ellipse(p.x,p.y-40*p.scale,22*p.scale,30*p.scale,0,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.fillRect(p.x-3*p.scale,p.y-14*p.scale,6*p.scale,15*p.scale)}}const front=project(player.x+Math.cos(player.a)*3,player.y+Math.sin(player.a)*3);x.fillStyle='#5a341e';x.fillRect(W/2-3,H-100,6,90);x.fillStyle='#d9a066';x.beginPath();x.arc(W/2,H-105,24,0,Math.PI*2);x.fill();x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,H*.52,W,2);document.getElementById('cash').textContent=Math.floor(cash);document.getElementById('hp').textContent=hp;document.getElementById('wave').textContent=wave;document.getElementById('count').textContent=balloons.length;document.getElementById('status').textContent=messageTime>0?message:(active?'WAVE '+wave:'READY');}
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}frame(last);
</script></body></html>
