<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Meadow</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#87ceeb}canvas{display:block}#ui{position:fixed;inset:0;color:white;pointer-events:none;text-shadow:0 2px 3px #000}.stats{padding:14px;display:flex;gap:10px;font-weight:900}.box{background:#10253dcc;border-radius:12px;padding:9px 13px}.cross{position:absolute;left:50%;top:50%;font-size:28px;transform:translate(-50%,-50%)}#start{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);pointer-events:auto;padding:14px 28px;border:0;border-radius:12px;background:#ffd34d;font-weight:900;font-size:18px;cursor:pointer}#tip{position:absolute;left:50%;top:65%;transform:translateX(-50%);background:#10253dcc;padding:8px 12px;border-radius:10px}#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;text-align:center}</style></head><body><div id="ui"><div class="stats"><div class="box">💰 $<span id="cash">0</span></div><div class="box">❤️ <span id="hp">10</span></div><div class="box">🌊 Wave <span id="wave">0</span></div></div><div class="cross">+</div><div id="msg">GOOB MEADOW</div><div id="tip">WASD = walk • Mouse = look • Click = throw dart</div><button id="start">START WAVE</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd5f2);scene.fog=new THREE.Fog(0x8bd5f2,25,95);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,150);camera.position.set(0,2,14);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdff8ff,0x44663b,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-20,30,15);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x61b84f}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const path=new THREE.Mesh(new THREE.PlaneGeometry(12,90),new THREE.MeshStandardMaterial({color:0xb98b55}));path.rotation.x=-Math.PI/2;path.position.set(0,.02,-20);scene.add(path);
for(let i=0;i<45;i++){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,1.3,7),new THREE.MeshStandardMaterial({color:0x75472b}));t.position.y=.65;const c=new THREE.Mesh(new THREE.SphereGeometry(.8,9,7),new THREE.MeshStandardMaterial({color:0x27703b}));c.position.y=1.45;g.add(t,c);g.position.set((Math.random()-.5)*75,0,(Math.random()-.5)*75);if(Math.abs(g.position.x)<8)g.position.x+=15;g.traverse(o=>o.castShadow=true);scene.add(g)}
let wave=0,cash=0,hp=10,active=false,spawn=0,spawnTimer=0,balloons=[],darts=[],keys={};const balloonColors=[0xff5555,0x55aaff,0xffdd55,0x66dd77];function balloon(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.7,18,14),new THREE.MeshStandardMaterial({color:balloonColors[Math.floor(Math.random()*4)]}));b.scale.set(.85,1.1,.85);b.castShadow=true;g.add(b);const s=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.9,6),new THREE.MeshStandardMaterial({color:0xffffff}));s.position.y=-1;g.add(s);g.position.set((Math.random()-.5)*8,2+Math.random()*2,-42);g.userData={z:-42,hp:1,speed:5+wave*.25};scene.add(g);balloons.push(g)}
function startWave(){if(active)return;wave++;active=true;spawn=6+wave*3;spawnTimer=0;document.getElementById('msg').textContent='WAVE '+wave}document.getElementById('start').onclick=startWave;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let locked=false;renderer.domElement.addEventListener('click',()=>{if(!locked){renderer.domElement.requestPointerLock();locked=true;return}throwDart()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){camera.rotation.y-=e.movementX*.002;camera.rotation.x-=e.movementY*.002;camera.rotation.x=Math.max(-1.3,Math.min(1.3,camera.rotation.x))}});
function throwDart(){const d=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,1.5,8),new THREE.MeshStandardMaterial({color:0x4b2b17}));d.rotation.copy(camera.rotation);d.rotateX(Math.PI/2);d.position.copy(camera.position);d.userData.vel=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(32);scene.add(d);darts.push(d)}function updateUI(){cash=Math.floor(cash);document.getElementById('cash').textContent=cash;document.getElementById('hp').textContent=hp;document.getElementById('wave').textContent=wave;document.getElementById('start').style.display=active?'none':'block'}
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const dir=new THREE.Vector3();if(keys.w)dir.z-=1;if(keys.s)dir.z+=1;if(keys.a)dir.x-=1;if(keys.d)dir.x+=1;if(dir.length()){dir.normalize().applyEuler(new THREE.Euler(0,camera.rotation.y,0));camera.position.addScaledVector(dir,10*dt)}camera.position.x=Math.max(-25,Math.min(25,camera.position.x));camera.position.z=Math.max(-45,Math.min(35,camera.position.z));if(active&&spawn>0){spawnTimer-=dt;if(spawnTimer<=0){balloon();spawn--;spawnTimer=.65}}balloons.slice().forEach(b=>{b.position.z+=b.userData.speed*dt;b.position.y+=Math.sin(now*.004+b.position.x)*dt*.5;if(b.position.z>12){scene.remove(b);balloons.splice(balloons.indexOf(b),1);hp--;if(hp<=0){active=false;document.getElementById('msg').textContent='GAME OVER';}}});darts.slice().forEach(d=>{d.position.addScaledVector(d.userData.vel,dt);if(d.position.length()>120){scene.remove(d);darts.splice(darts.indexOf(d),1);return}for(const b of balloons.slice()){if(d.position.distanceTo(b.position)<.85){cash+=10;scene.remove(b);balloons.splice(balloons.indexOf(b),1);scene.remove(d);darts.splice(darts.indexOf(d),1);break}}});if(active&&spawn===0&&balloons.length===0){active=false;cash+=50+wave*10;document.getElementById('msg').textContent='WAVE COMPLETE'}updateUI();renderer.render(scene,camera)}updateUI();loop(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
