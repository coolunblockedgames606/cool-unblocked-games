<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Tower Defense 3D - Playable</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6fc5e8;font-family:Arial,sans-serif;color:#fff}canvas{display:block}.ui{position:fixed;inset:0;z-index:10;pointer-events:none}.top{display:flex;gap:8px;padding:12px}.pill,.panel,.help{background:#13243df2;border:2px solid #ffffff2b;border-radius:14px;box-shadow:0 8px 25px #0008}.pill{padding:9px 13px;font-weight:900}.panel{position:absolute;right:14px;top:14px;width:245px;padding:14px;pointer-events:auto}.panel h2{margin:0}.panel p{font-size:13px;color:#c4d1df}.button{display:block;width:100%;margin:7px 0;padding:11px;border:0;border-radius:10px;background:#347ba4;color:#fff;font-weight:900;cursor:pointer}.button.active{outline:3px solid #ffe15b}.button.start{background:#e7b83e;color:#392600}.help{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:9px 14px;font-weight:800}.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:24px 32px;background:#13243df5;border:2px solid #ffffff35;border-radius:18px;text-align:center;display:none;pointer-events:auto}.banner button{padding:11px 20px;border:0;border-radius:10px;font-weight:900;background:#ffe05b}</style></head><body><div class="ui"><div class="top"><div class="pill">💰 $<span id="cash">650</span></div><div class="pill">❤️ <span id="life">100</span></div><div class="pill">🌊 Round <span id="wave">1</span></div><div class="pill">👾 <span id="num">0</span></div></div><div class="panel"><h2>Build</h2><p>Select a defender, then click a glowing green pad on the map.</p><button class="button tower" data-type="blaster">🔵 Goob Blaster — $200</button><button class="button tower" data-type="rapid">🟠 Rapid Goob — $350</button><button class="button tower" data-type="cannon">🟣 Goob Cannon — $500</button><button class="button start" id="start">▶ START ROUND</button><div id="status">Map ready. Select a tower.</div></div><div class="help">Drag to rotate • Wheel to zoom • Click green pads to build</div><div class="banner" id="banner"><h1 id="title"></h1><p id="text"></p><button id="again">PLAY AGAIN</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x72c8eb);scene.fog=new THREE.Fog(0x72c8eb,60,140);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);let yaw=.55,pitch=.72,distance=52;camera.position.set(Math.sin(yaw)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*distance);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdff8ff,0x2a5135,2.2));const sun=new THREE.DirectionalLight(0xfff1c5,3.2);sun.position.set(-30,45,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const base=new THREE.Mesh(new THREE.CylinderGeometry(35,39,5,64),new THREE.MeshStandardMaterial({color:0x2e754b,roughness:1}));base.position.y=-2.5;base.receiveShadow=true;scene.add(base);const field=new THREE.Mesh(new THREE.CylinderGeometry(33,35,1.4,64),new THREE.MeshStandardMaterial({color:0x74cc59,roughness:.95}));field.position.y=.2;field.receiveShadow=true;scene.add(field);const ocean=new THREE.Mesh(new THREE.CircleGeometry(48,64),new THREE.MeshStandardMaterial({color:0x39a9d1,roughness:.25}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-.7;scene.add(ocean);
// Wide, visible S track
const control=[new THREE.Vector3(-28,1.4,-16),new THREE.Vector3(-20,1.4,-16),new THREE.Vector3(-12,1.4,-10),new THREE.Vector3(-7,1.4,0),new THREE.Vector3(0,1.4,12),new THREE.Vector3(10,1.4,16),new THREE.Vector3(19,1.4,11),new THREE.Vector3(26,1.4,1),new THREE.Vector3(28,1.4,-16)];const curve=new THREE.CatmullRomCurve3(control);const road=new THREE.Mesh(new THREE.TubeGeometry(curve,220,3.15,18,false),new THREE.MeshStandardMaterial({color:0xc3945c,roughness:1}));road.castShadow=true;road.receiveShadow=true;scene.add(road);const roadStripe=new THREE.Mesh(new THREE.TubeGeometry(curve,220,.11,8,false),new THREE.MeshStandardMaterial({color:0xe8c77e}));scene.add(roadStripe);
function gate(pos,color){const g=new THREE.Group();const pole=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,4,12),new THREE.MeshStandardMaterial({color}));pole.position.y=2;g.add(pole);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.6,.15,10,24),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.35}));ring.rotation.x=Math.PI/2;ring.position.y=1.3;g.add(ring);g.position.copy(pos);scene.add(g)}gate(control[0],0x36d9ff);gate(control[control.length-1],0xff405d);
const pads=[];for(const [x,z] of [[-21,-6],[-17,6],[-9,-15],[-2,-3],[4,-12],[6,6],[11,21],[15,2],[22,-8],[-5,20],[-20,20]]){const p=new THREE.Mesh(new THREE.CylinderGeometry(2.15,2.15,.4,32),new THREE.MeshStandardMaterial({color:0x55e879,emissive:0x1c6c2b,emissiveIntensity:.28}));p.position.set(x,1.05,z);p.userData.occupied=false;scene.add(p);pads.push(p)}
function tree(x,z){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,2.5,8),new THREE.MeshStandardMaterial({color:0x754b2b}));t.position.y=1.7;g.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(1.7,12,10),new THREE.MeshStandardMaterial({color:0x245e36}));c.position.y=3.2;g.add(c);g.position.set(x,0,z);g.traverse(o=>o.castShadow=true);scene.add(g)}[[-29,8],[-25,23],[-8,28],[7,27],[26,23],[31,8],[-30,-25],[-8,-27],[8,-27],[29,-25]].forEach(p=>tree(...p));
const stats={blaster:{cost:200,range:8,damage:1,rate:.55,color:0x258be0},rapid:{cost:350,range:7,damage:1,rate:.25,color:0xf28a36},cannon:{cost:500,range:10,damage:4,rate:1.1,color:0x925de0}};let cash=650,lives=100,wave=1,selected=null,towers=[],enemies=[],shots=[],running=false,spawnLeft=0,spawnClock=0;
function tower(type){const s=stats[type],g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.45,.7,16),new THREE.MeshStandardMaterial({color:0x263746}));g.add(b);const body=new THREE.Mesh(new THREE.SphereGeometry(.88,18,12),new THREE.MeshStandardMaterial({color:s.color,roughness:.5}));body.position.y=.8;g.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.8,12),new THREE.MeshStandardMaterial({color:0x111a24,metalness:.5}));barrel.rotation.z=Math.PI/2;barrel.position.set(.85,1.05,0);g.add(barrel);g.userData={type,range:s.range,damage:s.damage,rate:s.rate,cool:0};g.traverse(o=>o.castShadow=true);return g}function enemy(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.9,18,14),new THREE.MeshStandardMaterial({color:wave%3===0?0xffc44d:0xef5367,roughness:.5}));b.castShadow=true;g.add(b);const e1=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),new THREE.MeshStandardMaterial({color:0xffffff}));e1.position.set(-.25,.2,.75);g.add(e1);const e2=e1.clone();e2.position.x=.25;g.add(e2);g.userData={t:0,hp:5+wave*1.7,speed:.055+wave*.002};g.position.copy(curve.getPoint(0));g.position.y=2.2;scene.add(g);enemies.push(g)}
function hud(){cash=Math.floor(cash);document.getElementById('cash').textContent=cash;document.getElementById('life').textContent=lives;document.getElementById('wave').textContent=wave;document.getElementById('num').textContent=enemies.length;document.getElementById('status').textContent=selected?'Selected '+selected.toUpperCase()+' — click a green pad.':'Map ready. Select a tower.'}function choose(type){selected=type;document.querySelectorAll('.tower').forEach(b=>b.classList.toggle('active',b.dataset.type===type));hud()}document.querySelectorAll('.tower').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.type)));
function place(p){if(!selected||p.userData.occupied)return;if(cash<stats[selected].cost){document.getElementById('status').textContent='Not enough money.';return}cash-=stats[selected].cost;const t=tower(selected);t.position.set(p.position.x,1.25,p.position.z);t.userData.pad=p;p.userData.occupied=true;p.material.color.setHex(0x4b5560);scene.add(t);towers.push(t);selected=null;document.querySelectorAll('.tower').forEach(b=>b.classList.remove('active'));hud()}
function startRound(){if(running)return;running=true;spawnLeft=7+wave*2;spawnClock=0;document.getElementById('start').textContent='ROUND RUNNING'}document.getElementById('start').addEventListener('click',startRound);function gameOver(){running=false;document.getElementById('title').textContent='GAME OVER';document.getElementById('text').textContent='The enemies reached the exit.';document.getElementById('banner').style.display='block'}document.getElementById('again').onclick=()=>location.reload();
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let dragging=false,moved=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;moved=false;lx=e.clientX;ly=e.clientY});addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;yaw-=dx*.008;pitch=Math.max(.28,Math.min(1.25,pitch+dy*.006));lx=e.clientX;ly=e.clientY});addEventListener('pointerup',e=>{if(!moved){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pads,false)[0];if(hit)place(hit.object)}dragging=false});addEventListener('wheel',e=>{distance=Math.max(24,Math.min(72,distance+e.deltaY*.045))},{passive:true});
function shoot(t,target){const s=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),new THREE.MeshBasicMaterial({color:0xffef70}));s.position.copy(t.position);s.userData={target,damage:t.userData.damage,speed:28};scene.add(s);shots.push(s)}let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;if(running){if(spawnLeft>0){spawnClock-=dt;if(spawnClock<=0){enemy();spawnLeft--;spawnClock=.62}}else if(enemies.length===0){cash+=100+wave*10;wave++;running=false;document.getElementById('start').textContent='▶ START ROUND'}}for(const e of enemies.slice()){e.userData.t+=e.userData.speed*dt;e.position.copy(curve.getPoint(Math.min(1,e.userData.t)));e.position.y=2.2;e.rotation.y+=dt*2;if(e.userData.t>=1){scene.remove(e);enemies.splice(enemies.indexOf(e),1);lives-=5;if(lives<=0)gameOver()}}for(const t of towers){t.userData.cool-=dt;if(t.userData.cool<=0){const target=enemies.filter(e=>e.position.distanceTo(t.position)<=t.userData.range).sort((a,b)=>b.userData.t-a.userData.t)[0];if(target){t.lookAt(target.position.x,t.position.y,target.position.z);shoot(t,target);t.userData.cool=t.userData.rate}}}for(const s of shots.slice()){const target=s.userData.target;if(!target.parent){scene.remove(s);shots.splice(shots.indexOf(s),1);continue}const d=target.position.clone().sub(s.position),step=s.userData.speed*dt;if(d.length()<step){target.userData.hp-=s.userData.damage;scene.remove(s);shots.splice(shots.indexOf(s),1);if(target.userData.hp<=0){cash+=12+wave;scene.remove(target);enemies.splice(enemies.indexOf(target),1)}}else s.position.add(d.normalize().multiplyScalar(step))}camera.position.set(Math.sin(yaw)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*distance);camera.lookAt(0,1,0);hud();renderer.render(scene,camera)}animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();</script></body></html>
