<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Tower Defense — 3D Battle</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Segoe UI,sans-serif;background:#07172b;color:#fff}#game{position:fixed;inset:0;background:linear-gradient(#67dfff 0,#9bd6ff 45%,#4779aa 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;z-index:5;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{pointer-events:auto;background:linear-gradient(#214c73,#0b2847);border:3px solid #78d9ef;border-radius:16px;padding:8px 13px;box-shadow:0 6px 0 #071b31;font-weight:900}.money{color:#ffe15a}.controls{position:absolute;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:end}.towerBtn{width:88px;height:104px;border:4px solid #fff;border-radius:18px;background:linear-gradient(#49d5ff,#2872b8);color:white;box-shadow:0 8px 0 #163f65;cursor:pointer;font-weight:900;transition:.15s}.towerBtn:hover{transform:translateY(-6px)}.towerBtn .icon{font-size:35px;display:block}.towerBtn small{display:block}.start{width:120px;height:90px;border-radius:22px;background:linear-gradient(#a8ff75,#43bc4e);color:#173c1e;border:4px solid #fff;box-shadow:0 8px 0 #246f31;font-size:20px;font-weight:1000;cursor:pointer}.side{position:absolute;z-index:7;right:14px;top:82px;width:245px;background:#eaf8ff;color:#17345d;border:4px solid #ffe15a;border-radius:20px;padding:14px;box-shadow:0 12px 0 #17265f;display:none}.side.show{display:block}.side h2{margin:0 0 5px}.up{width:100%;padding:10px;border:0;border-radius:12px;background:#ffe15a;color:#583600;font-weight:900;cursor:pointer;margin-top:7px}.back{position:absolute;z-index:10;top:12px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:12px;background:#ff7182;color:white;border:3px solid #fff;box-shadow:0 5px 0 #8c3042;font-weight:900;cursor:pointer}.tip{position:absolute;z-index:5;left:50%;top:74px;transform:translateX(-50%);background:#123b60dd;border:2px solid #7ce9ff;border-radius:12px;padding:7px 12px;font-weight:800;text-align:center}.pause{padding:8px 12px;border-radius:10px;background:#ffe15a;border:0;font-weight:900;cursor:pointer}.wave{color:#8dff9e}.toast{position:absolute;z-index:20;left:50%;top:18%;transform:translate(-50%,-50%);font-size:28px;font-weight:1000;text-shadow:0 4px 0 #17345d;opacity:0;transition:.3s}.toast.on{opacity:1;top:24%}</style></head><body><div id="game"><canvas id="c"></canvas><div class="hud"><div class="pill">⭐ <span id="level">7</span> <span id="xp">620</span>/1000 XP</div><div class="pill money">💵 $<span id="cash">750</span> &nbsp; <span class="wave">WAVE <span id="wave">1</span>/40</span> <button class="pause" id="pause">Ⅱ</button></div></div><button class="back" id="back">← HUB</button><div class="tip">Click a tower card, then click the grassy island to place it.</div><div class="controls"><button class="towerBtn" data-type="dart"><span class="icon">🏹</span>Scout<small>$200</small></button><button class="towerBtn" data-type="cannon"><span class="icon">💣</span>Boomer<small>$350</small></button><button class="towerBtn" data-type="magic"><span class="icon">✨</span>Wizard<small>$500</small></button><button class="towerBtn" data-type="ice"><span class="icon">❄️</span>Frost<small>$450</small></button><button class="start" id="start">START<br>WAVE ▶</button></div><div class="side" id="side"><h2 id="selName">Goob</h2><p id="selStats">Select a tower</p><button class="up" id="upgrade">UPGRADE — $<span id="upCost">100</span></button><button class="up" id="sell" style="background:#ff8795">SELL</button></div><div class="toast" id="toast"></div></div><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,mouse={x:0,y:0},placing=null,towers=[],enemies=[],shots=[],wave=1,cash=750,xp=620,level=7,running=false,paused=false,selected=null,spawn=0;const params=new URLSearchParams(location.search),map=params.get('map')||'Goob Garden';const themes={'Goob Garden':['#59d86d','#cde5b0','#b97d45'],'Sugar Speedway':['#ff8fc9','#f6dcff','#c56b90'],'Goob Galaxy':['#5547c7','#18204d','#40388d'],'Magma Falls':['#ef704b','#6e3840','#b54831'],'Cloud Kingdom':['#9de9ff','#e9f4ff','#7598d2'],'Neon City':['#28448f','#14182f','#45e1dc']};const th=themes[map]||themes['Goob Garden'];function resize(){dpr=Math.min(devicePixelRatio,1.5);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=4;ctx.stroke()}}function pathAt(t){const a=[[-.1,.63],[.12,.57],[.27,.67],[.44,.48],[.58,.54],[.72,.35],[1.1,.4]];for(let i=0;i<a.length-1;i++){if(t<=a[i+1][0]){let u=(t-a[i][0])/(a[i+1][0]-a[i][0]);return{x:(a[i][0]+(a[i+1][0]-a[i][0])*u)*W,y:(a[i][1]+(a[i+1][1]-a[i][1])*u)*H}}}return{x:W,y:.4*H}}function drawScene(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th[0]);g.addColorStop(.55,th[1]);g.addColorStop(1,'#21415b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8';for(let i=0;i<8;i++){let x=(i*197+80)%W,y=80+(i*83)%180;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.fill()}for(let i=0;i<7;i++){let x=i*W/6-50,y=H*.38+(i%2)*25;ctx.fillStyle='#2c755d';ctx.beginPath();ctx.moveTo(x,y+100);ctx.lineTo(x+80,y-40);ctx.lineTo(x+170,y+100);ctx.fill()}poly([[0,H*.58],[W*.15,H*.47],[W*.3,H*.6],[W*.47,H*.42],[W*.64,H*.57],[W*.82,H*.39],[W,H*.52],[W,H],[0,H]],th[2]);ctx.save();ctx.globalAlpha=.95;ctx.lineCap='round';ctx.lineWidth=Math.max(60,W*.055);ctx.strokeStyle='#b38b61';ctx.beginPath();let pts=[[-.08,.63],[.12,.57],[.27,.67],[.44,.48],[.58,.54],[.72,.35],[1.08,.4]];pts.forEach((p,i)=>i?ctx.lineTo(p[0]*W,p[1]*H):ctx.moveTo(p[0]*W,p[1]*H));ctx.stroke();ctx.lineWidth=Math.max(46,W*.043);ctx.strokeStyle='#e5c98d';ctx.stroke();ctx.restore();for(let i=0;i<10;i++){let x=(i*137)%W,y=H*.55+(i%4)*55;drawTree(x,y,.7+(i%3)*.15)}for(let i=0;i<5;i++){let x=W*.15+i*W*.18,y=H*.44+(i%2)*40;drawRock(x,y)}towers.forEach(drawTower);enemies.forEach(drawEnemy);shots.forEach(s=>{ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,6,0,7);ctx.fill()})}function drawTree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#70432b';ctx.fillRect(-8,0,16,55);ctx.fillStyle='#36aa59';ctx.beginPath();ctx.arc(0,-10,35,0,7);ctx.arc(-23,5,25,0,7);ctx.arc(25,5,25,0,7);ctx.fill();ctx.restore()}function drawRock(x,y){ctx.fillStyle='#687f89';ctx.beginPath();ctx.ellipse(x,y,28,18,0,0,7);ctx.fill();ctx.fillStyle='#91a7aa';ctx.beginPath();ctx.ellipse(x-8,y-5,12,6,0,0,7);ctx.fill()}function drawTower(t){let x=t.x,y=t.y,s=1+t.level*.04;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,25,34,13,0,0,7);ctx.fill();ctx.fillStyle='#d9bd73';ctx.beginPath();ctx.ellipse(0,18,31,15,0,0,7);ctx.fill();let colors={dart:'#4cc7e8',cannon:'#f18a4c',magic:'#a66bea',ice:'#79e7ff'};ctx.fillStyle=colors[t.type];ctx.strokeStyle='#173e75';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,-5,29,34,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-10,-10,7,0,7);ctx.arc(10,-10,7,0,7);ctx.fill();ctx.fillStyle='#173e75';ctx.beginPath();ctx.arc(-10,-10,3,0,7);ctx.arc(10,-10,3,0,7);ctx.fill();if(t.type==='cannon'){ctx.fillStyle='#303e52';ctx.fillRect(-7,-48,14,30)}if(t.type==='magic'){ctx.fillStyle='#ffe15a';ctx.beginPath();ctx.arc(0,-40,9,0,7);ctx.fill()}if(t.type==='ice'){ctx.strokeStyle='#dfffff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-20,-28);ctx.lineTo(20,-45);ctx.stroke()}ctx.restore()}function drawEnemy(e){let x=e.x,y=e.y,s=e.size;ctx.save();ctx.translate(x,y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,15,20,7,0,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,16*s,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-3,4,0,7);ctx.arc(6,-3,4,0,7);ctx.fill();ctx.fillStyle='#24344b';ctx.beginPath();ctx.arc(-6,-3,2,0,7);ctx.arc(6,-3,2,0,7);ctx.fill();ctx.restore()}function addTower(type,x,y){const cost={dart:200,cannon:350,magic:500,ice:450}[type];if(cash<cost){toast('Not enough Goob Bucks!');return}cash-=cost;towers.push({type,x,y,level:1,spent:cost,cool:0});updateHud();toast('Goob placed!')}function shoot(t){let target=enemies.find(e=>Math.hypot(e.x-t.x,e.y-t.y)<180);if(!target)return;shots.push({x:t.x,y:t.y,tx:target,damage:t.level*(t.type==='cannon'?3:1),color:t.type==='ice'?'#9ff':t.type==='magic'?'#e66bff':'#ffe15a'})}function update(dt){if(paused)return;if(running){spawn-=dt;if(spawn<=0&&enemies.length<12){let hp=3+wave*2;enemies.push({p:0,hp,max:hp,x:0,y:0,size:1,color:['#e95757','#f59e4c','#bd64e8','#53c9dc'][wave%4]});spawn=Math.max(.25,1-wave*.012)}enemies.forEach(e=>{e.p+=dt*(.035+wave*.001);let p=pathAt(e.p);e.x=p.x;e.y=p.y;if(e.p>=1){e.dead=true;toast('A Goob escaped!')}});enemies=enemies.filter(e=>!e.dead);towers.forEach(t=>{t.cool-=dt;if(t.cool<=0){shoot(t);t.cool=Math.max(.25,.8-t.level*.06)}});shots.forEach(s=>{if(!s.tx||s.tx.dead)return;s.x+=(s.tx.x-s.x)*Math.min(1,dt*10);s.y+=(s.tx.y-s.y)*Math.min(1,dt*10);if(Math.hypot(s.x-s.tx.x,s.y-s.tx.y)<10){s.tx.hp-=s.damage;s.hit=true;if(s.tx.hp<=0){s.tx.dead=true;cash+=18;xp+=10;updateHud()}}});shots=shots.filter(s=>!s.hit&&s.tx&&!s.tx.dead);if(enemies.length===0&&spawn<0&&running&&spawn===0){}}drawScene();requestAnimationFrame(loop)}function loop(t){let dt=Math.min(.05,(t-(loop.last||t))/1000);loop.last=t;update(dt)}requestAnimationFrame(loop);function updateHud(){document.getElementById('cash').textContent=Math.floor(cash);document.getElementById('xp').textContent=xp;document.getElementById('level').textContent=level;document.getElementById('wave').textContent=wave}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1200)}document.querySelectorAll('.towerBtn').forEach(b=>b.onclick=()=>{placing=b.dataset.type;toast('Now click the island to place your '+b.textContent.trim())});canvas.onclick=e=>{if(!placing)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(y>H*.43&&y<H*.9){addTower(placing,x,y);placing=null}};canvas.onmousemove=e=>{mouse.x=e.clientX;mouse.y=e.clientY};document.getElementById('start').onclick=()=>{if(running)return;running=true;spawn=0;toast('Wave '+wave+' started!')};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'};document.getElementById('back').onclick=()=>history.back();canvas.addEventListener('dblclick',e=>{let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,t=towers.find(a=>Math.hypot(a.x-x,a.y-y)<45);if(t){selected=t;document.getElementById('side').classList.add('show');document.getElementById('selName').textContent=t.type.toUpperCase()+' GOOB • LEVEL '+t.level;document.getElementById('selStats').textContent='Range 180 • Damage '+(t.level*(t.type==='cannon'?3:1));document.getElementById('upCost').textContent=100*t.level}});document.getElementById('upgrade').onclick=()=>{if(!selected)return;let c=100*selected.level;if(cash<c){toast('Need more cash!');return}cash-=c;selected.level++;selected.spent+=c;updateHud();document.getElementById('selName').textContent=selected.type.toUpperCase()+' GOOB • LEVEL '+selected.level;document.getElementById('upCost').textContent=100*selected.level;toast('Tower upgraded!')};document.getElementById('sell').onclick=()=>{if(!selected)return;cash+=Math.floor(selected.spent*.7);towers=towers.filter(x=>x!==selected);selected=null;document.getElementById('side').classList.remove('show');updateHud();toast('Tower sold!')};document.title+=' — '+map;</script></body></html>
