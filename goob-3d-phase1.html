<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Tower Defense 3D — Phase 1</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08111f;font-family:system-ui;color:#fff}#hud{position:fixed;z-index:5;inset:0;pointer-events:none}.top{display:flex;gap:10px;padding:14px}.pill{background:#14243bd9;border:2px solid #ffffff22;border-radius:14px;padding:10px 15px;font-weight:900;box-shadow:0 5px 15px #0006}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#14243bd9;border:2px solid #ffffff22;border-radius:14px;padding:10px 16px;font-weight:700}.panel{position:absolute;right:18px;top:18px;width:245px;background:#14243bf0;border:2px solid #ffffff25;border-radius:18px;padding:16px;box-shadow:0 12px 35px #0008}.panel h2{margin:0 0 8px}.panel p{color:#b8c8db;line-height:1.4}.badge{display:inline-block;background:#285e91;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:900}#start{pointer-events:auto;border:0;border-radius:12px;padding:11px 16px;background:#ffd34d;color:#432900;font-weight:1000;cursor:pointer}canvas{display:block}</style></head><body><div id="hud"><div class="top"><div class="pill">💰 $650</div><div class="pill">❤️ 100</div><div class="pill">🌊 Round 1</div></div><div class="panel"><span class="badge">PHASE 1</span><h2>3D Map Prototype</h2><p>Real 3D terrain, camera controls, lighting, water, placement zones and an original Goob island.</p><button id="start">ENTER MAP</button></div><div class="hint">Drag = rotate camera • Wheel = zoom • Click green pad = place preview</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x79c9ee);scene.fog=new THREE.Fog(0x79c9ee,45,110);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,200);camera.position.set(25,24,30);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff6ff,0x31513c,2.1));const sun=new THREE.DirectionalLight(0xfff1c2,3.2);sun.position.set(-20,35,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(30,34,5,64),new THREE.MeshStandardMaterial({color:0x357c52,roughness:.95}));ground.position.y=-2.5;ground.receiveShadow=true;scene.add(ground);
const grass=new THREE.Mesh(new THREE.CylinderGeometry(28,30,1.4,64),new THREE.MeshStandardMaterial({color:0x71c957,roughness:.9}));grass.position.y=.3;grass.receiveShadow=true;scene.add(grass);
const pathMat=new THREE.MeshStandardMaterial({color:0xc89b60,roughness:1});const path=new THREE.Mesh(new THREE.TorusGeometry(16,2.25,16,100),pathMat);path.rotation.x=Math.PI/2;path.scale.y=.62;path.position.y=1.05;path.receiveShadow=true;scene.add(path);
const water=new THREE.Mesh(new THREE.CircleGeometry(20,64),new THREE.MeshStandardMaterial({color:0x39a9cf,roughness:.35,metalness:.05}));water.rotation.x=-Math.PI/2;water.position.y=-.7;scene.add(water);
const pads=[];for(let i=0;i<8;i++){const a=i*Math.PI/4+.3,r=10;const pad=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,.35,32),new THREE.MeshStandardMaterial({color:0x69db76,roughness:.8}));pad.position.set(Math.cos(a)*r,1.05,Math.sin(a)*r*.62);pad.castShadow=true;pad.receiveShadow=true;pad.userData.base=pad.material.color.getHex();scene.add(pad);pads.push(pad)}
function goob(x,z,s=1){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.SphereGeometry(1.45,24,16),new THREE.MeshStandardMaterial({color:0x4bb9ed,roughness:.5}));body.scale.set(1,.9,1);body.castShadow=true;g.add(body);for(const x2 of [-.45,.45]){const e=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),new THREE.MeshStandardMaterial({color:0xffffff}));e.position.set(x2,.25,1.2);g.add(e)}g.position.set(x,2,z);g.scale.setScalar(s);scene.add(g);return g}goob(-8,-7,.9);goob(9,-3,1.15);goob(-3,9,.75);goob(7,7,.95);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let selected=null;renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pads)[0];if(hit){if(selected)selected.material.color.setHex(selected.userData.base);selected=hit.object;selected.material.color.setHex(0xffdf55)}});
let dragging=false,lastX=0,lastY=0,yaw=.7,pitch=.62,dist=43;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.008;pitch=Math.max(.25,Math.min(1.25,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});addEventListener('wheel',e=>{dist=Math.max(22,Math.min(65,dist+e.deltaY*.04))},{passive:true});
function animate(t){requestAnimationFrame(animate);const target=new THREE.Vector3(0,0,0);camera.position.set(Math.sin(yaw)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*dist);camera.lookAt(target);pads.forEach((p,i)=>{p.position.y=1.05+Math.sin(t*.001+i)*.03});renderer.render(scene,camera)}animate(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('start').onclick=()=>document.querySelector('.panel').style.display='none';</script></body></html>
