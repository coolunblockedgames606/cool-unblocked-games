<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Tower Defense 3D — Phase 2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08111f;font-family:system-ui;color:white}#hud{position:fixed;z-index:5;inset:0;pointer-events:none}.top{display:flex;gap:8px;padding:12px;flex-wrap:wrap}.pill,.panel{background:#14243be8;border:2px solid #ffffff22;border-radius:14px;box-shadow:0 8px 25px #0007}.pill{padding:9px 13px;font-weight:900}.panel{position:absolute;right:14px;top:14px;width:230px;padding:14px;pointer-events:auto}.panel h2{margin:0 0 6px}.panel p{color:#b8c8db;font-size:13px}.towerBtn{width:100%;margin:6px 0;padding:10px;border:0;border-radius:10px;background:#2b5f83;color:#fff;font-weight:900;cursor:pointer}.towerBtn:hover{background:#3b7fa9}.sel{outline:3px solid #ffe04c}.bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#14243be8;border:2px solid #ffffff22;border-radius:14px;padding:9px 14px;font-weight:800}.towerInfo{margin-top:10px;padding-top:8px;border-top:1px solid #ffffff22;font-size:13px}</style></head><body><div id="hud"><div class="top"><div class="pill">💰 $<span id="money">650</span></div><div class="pill">❤️ <span id="lives">100</span></div><div class="pill">🌊 Round <span id="round">1</span></div><div class="pill">👾 <span id="count">0</span></div></div><div class="panel"><h2>Defenders</h2><p>Select a Goob, then click a green pad.</p><button class="towerBtn" data-type="blaster">🔵 Goob Blaster — $200</button><button class="towerBtn" data-type="rapid">🟠 Rapid Goob — $350</button><button class="towerBtn" data-type="cannon">🟣 Goob Cannon — $500</button><button id="start" class="towerBtn">▶ Start Round</button><div id="info" class="towerInfo">Select a defender.</div></div><div class="bottom">Drag = rotate • Wheel = zoom • Click green pads = place tower</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x78c9ee);scene.fog=new THREE.Fog(0x78c9ee,45,120);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,200),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe5f8ff,0x29452f,2));const sun=new THREE.DirectionalLight(0xfff0bf,3);sun.position.set(-25,35,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const island=new THREE.Mesh(new THREE.CylinderGeometry(30,34,5,64),new THREE.MeshStandardMaterial({color:0x357b51,roughness:1}));island.position.y=-2.5;island.receiveShadow=true;scene.add(island);const grass=new THREE.Mesh(new THREE.CylinderGeometry(28,30,1.4,64),new THREE.MeshStandardMaterial({color:0x71c957,roughness:.9}));grass.position.y=.3;grass.receiveShadow=true;scene.add(grass);const water=new THREE.Mesh(new THREE.CircleGeometry(25,64),new THREE.MeshStandardMaterial({color:0x38a9d0,roughness:.3}));water.rotation.x=-Math.PI/2;water.position.y=-.7;scene.add(water);const path=new THREE.Mesh(new THREE.TorusGeometry(16,2.2,18,120),new THREE.MeshStandardMaterial({color:0xc79b61,roughness:1}));path.rotation.x=Math.PI/2;path.scale.y=.62;path.position.y=1.03;scene.add(path);const pads=[];for(let i=0;i<10;i++){const a=i*Math.PI*2/10+.15,p=new THREE.Mesh(new THREE.CylinderGeometry(2.05,2.05,.35,32),new THREE.MeshStandardMaterial({color:0x65d875}));p.position.set(Math.cos(a)*10,1.05,Math.sin(a)*10*.62);p.userData.base=0x65d875;p.castShadow=true;scene.add(p);pads.push(p)}function makeGoob(pos,color,s=1){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.SphereGeometry(1.25,20,14),new THREE.MeshStandardMaterial({color,roughness:.55}));b.scale.y=.9;b.castShadow=true;g.add(b);for(const x of[-.38,.38]){const e=new THREE.Mesh(new THREE.SphereGeometry(.17,10,8),new THREE.MeshStandardMaterial({color:0xffffff}));e.position.set(x,.25,1.08);g.add(e)}g.position.copy(pos);g.scale.setScalar(s);scene.add(g)}makeGoob(new THREE.Vector3(-8,2,-7),0x4bb9ed,.9);makeGoob(new THREE.Vector3(9,2,-3),0xffb84d,1.1);makeGoob(new THREE.Vector3(-3,2,9),0x8f67e8,.8);makeGoob(new THREE.Vector3(7,2,7),0x55d66d,.95);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let selectedType=null,towers=[],enemies=[],shots=[],money=650,round=1,running=false;const costs={blaster:200,rapid:350,cannon:500};function towerModel(type){const colors={blaster:0x2388dc,rapid:0xf28c38,cannon:0x8c5bd6},g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.4,.65,16),new THREE.MeshStandardMaterial({color:0x24384a}));g.add(base);const body=new THREE.Mesh(new THREE.SphereGeometry(.9,16,12),new THREE.MeshStandardMaterial({color:colors[type]}));body.position.y=.8;g.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,1.5,12),new THREE.MeshStandardMaterial({color:0x17202a,metalness:.5}));barrel.rotation.z=Math.PI/2;barrel.position.set(.75,1.05,0);g.add(barrel);g.userData={type,cool:0};return g}function pathPoint(t){const a=t*Math.PI*2;return new THREE.Vector3(Math.cos(a)*16,2,Math.sin(a)*16*.62)}function enemyModel(hp){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.SphereGeometry(.72,16,12),new THREE.MeshStandardMaterial({color:0xf04e68}));g.add(b);g.userData={hp,max:hp,t:Math.random()*.05};return g}function spawnEnemy(){const e=enemyModel(3+round*.7);e.position.copy(pathPoint(e.userData.t));scene.add(e);enemies.push(e)}function placeTower(p){if(!selectedType||p.userData.occupied||money<costs[selectedType])return;money-=costs[selectedType];const t=towerModel(selectedType);t.position.copy(p.position);t.position.y=1.25;t.userData.range=selectedType==='cannon'?9:selectedType==='rapid'?7:8;t.userData.damage=selectedType==='cannon'?3:1;t.userData.cool=0;p.userData.occupied=true;p.material.color.setHex(0x44515c);scene.add(t);towers.push(t);selectedType=null;document.querySelectorAll('.towerBtn').forEach(x=>x.classList.remove('sel'));updateHud()}function shoot(t,e){const dir=e.position.clone().sub(t.position).normalize(),s=new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),new THREE.MeshBasicMaterial({color:0xffef71}));s.position.copy(t.position).add(dir.multiplyScalar(1.4));s.userData={target:e,damage:t.userData.damage,speed:22};scene.add(s);shots.push(s)}function updateHud(){document.getElementById('money').textContent=Math.floor(money);document.getElementById('round').textContent=round;document.getElementById('count').textContent=enemies.length;document.getElementById('info').textContent=selectedType?selectedType.toUpperCase()+' selected — click a green pad.':'Select a defender.'}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;document.querySelectorAll('.towerBtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');updateHud()});document.getElementById('start').onclick=()=>{if(running)return;running=true;const n=8+round*2;for(let i=0;i<n;i++)setTimeout(spawnEnemy,i*550);setTimeout(()=>{running=false;round++;money+=100;updateHud()},n*550+5000)});renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pads)[0];if(hit)placeTower(hit.object)});let drag=false,lx=0,ly=0,yaw=.7,pitch=.62,dist=43;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(.25,Math.min(1.25,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});addEventListener('wheel',e=>dist=Math.max(22,Math.min(65,dist+e.deltaY*.04)),{passive:true});let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;camera.position.set(Math.sin(yaw)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*dist);camera.lookAt(0,0,0);enemies.slice().forEach(e=>{e.userData.t+=dt*(.045+.003*round);e.position.copy(pathPoint(e.userData.t));if(e.userData.t>=1){scene.remove(e);enemies.splice(enemies.indexOf(e),1)}});towers.forEach(t=>{t.userData.cool-=dt;if(t.userData.cool<=0){const target=enemies.filter(e=>e.position.distanceTo(t.position)<=t.userData.range).sort((a,b)=>b.userData.t-a.userData.t)[0];if(target){t.lookAt(target.position.x,t.position.y,target.position.z);shoot(t,target);t.userData.cool=t.userData.type==='rapid'?.28:t.userData.type==='cannon'?1:.55}}});shots.slice().forEach(s=>{const target=s.userData.target;if(!target.parent){scene.remove(s);shots.splice(shots.indexOf(s),1);return}const d=target.position.clone().sub(s.position),step=s.userData.speed*dt;if(d.length()<=step){target.userData.hp-=s.userData.damage;scene.remove(s);shots.splice(shots.indexOf(s),1);if(target.userData.hp<=0){money+=12+round;scene.remove(target);enemies.splice(enemies.indexOf(target),1)}}else s.position.add(d.normalize().multiplyScalar(step))});updateHud();renderer.render(scene,camera)}animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateHud();</script></body></html>
