<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Tower Defense 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07121d;font-family:Arial,sans-serif;color:#fff}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;z-index:5}.top{display:flex;gap:8px;padding:12px}.pill,.side,.bottom{background:#13243deF;border:2px solid #ffffff26;border-radius:14px;box-shadow:0 8px 25px #0008}.pill{padding:9px 13px;font-weight:900}.side{position:absolute;right:14px;top:14px;width:240px;padding:14px;pointer-events:auto}.side h2{margin:0 0 5px}.side p{font-size:13px;color:#b9c9dc}.btn{display:block;width:100%;box-sizing:border-box;margin:7px 0;padding:11px;border:0;border-radius:10px;background:#286087;color:white;font-weight:900;cursor:pointer}.btn:hover{background:#377da7}.selected{outline:3px solid #ffe34d}.bottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:9px 14px;font-weight:800}.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#10223bf5;border:2px solid #ffffff35;border-radius:18px;padding:22px;text-align:center;min-width:280px;display:none;pointer-events:auto}.msg h1{margin:0 0 8px}.msg button{padding:11px 22px;border:0;border-radius:10px;font-weight:900;cursor:pointer;background:#ffd34d}</style></head><body><div id="ui"><div class="top"><div class="pill">💰 $<span id="money">650</span></div><div class="pill">❤️ <span id="lives">100</span></div><div class="pill">🌊 Round <span id="round">1</span></div><div class="pill">👾 <span id="enemies">0</span></div></div><div class="side"><h2>Defenders</h2><p>Pick a tower, then click a green build pad. Start the round when you're ready.</p><button class="btn tower" data-t="blaster">🔵 Goob Blaster — $200</button><button class="btn tower" data-t="rapid">🟠 Rapid Goob — $350</button><button class="btn tower" data-t="cannon">🟣 Goob Cannon — $500</button><button class="btn" id="start">▶ START ROUND</button><div id="status">Choose a tower.</div></div><div class="bottom">🖱️ Drag empty map to rotate • Wheel to zoom • Green pads = build locations</div><div class="msg" id="msg"><h1 id="msgTitle"></h1><p id="msgText"></p><button id="restart">PLAY AGAIN</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78c9ee);scene.fog=new THREE.Fog(0x78c9ee,55,125);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdff7ff,0x284c34,2));const sun=new THREE.DirectionalLight(0xfff2c9,3);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const island=new THREE.Mesh(new THREE.CylinderGeometry(34,38,6,64),new THREE.MeshStandardMaterial({color:0x2e754c,roughness:1}));island.position.y=-3;island.receiveShadow=true;scene.add(island);const field=new THREE.Mesh(new THREE.CylinderGeometry(32,34,1.5,64),new THREE.MeshStandardMaterial({color:0x72c958,roughness:.95}));field.position.y=.5;field.receiveShadow=true;scene.add(field);const water=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshStandardMaterial({color:0x39a9d1,roughness:.25}));water.rotation.x=-Math.PI/2;water.position.y=-.8;scene.add(water);
// A clear S-shaped playable road
const pts=[new THREE.Vector3(-27,1.25,-15),new THREE.Vector3(-18,1.25,-15),new THREE.Vector3(-10,1.25,-7),new THREE.Vector3(-2,1.25,7),new THREE.Vector3(7,1.25,14),new THREE.Vector3(17,1.25,8),new THREE.Vector3(25,1.25,-4),new THREE.Vector3(27,1.25,-15)];const curve=new THREE.CatmullRomCurve3(pts);curve.curveType='centripetal';const road=new THREE.Mesh(new THREE.TubeGeometry(curve,180,2.7,16,false),new THREE.MeshStandardMaterial({color:0xb98a56,roughness:1}));road.receiveShadow=true;scene.add(road);const line=new THREE.Mesh(new THREE.TubeGeometry(curve,180,.08,8,false),new THREE.MeshStandardMaterial({color:0xe8c27c}));line.position.y=.18;scene.add(line);
function marker(pos,text,color){const g=new THREE.Group();const c=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,.18,24),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.12}));g.add(c);g.position.copy(pos);g.position.y=1.05;scene.add(g);return g}const startMark=marker(pts[0],0x44e8ff,0x44e8ff),endMark=marker(pts[pts.length-1],0xff4e67,0xff4e67);
const pads=[];const padPositions=[[-20,-6],[-14,5],[-7,-14],[-1,-1],[6,-7],[10,18],[16,1],[22,-11],[2,16],[-13,15]];for(const [x,z] of padPositions){const p=new THREE.Mesh(new THREE.CylinderGeometry(2.05,2.05,.3,32),new THREE.MeshStandardMaterial({color:0x5cdb75,emissive:0x143b1d,emissiveIntensity:.25}));p.position.set(x,1.05,z);p.castShadow=true;p.userData.occupied=false;scene.add(p);pads.push(p)}
function tree(x,z){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,2.5,8),new THREE.MeshStandardMaterial({color:0x754a2d}));trunk.position.y=1.7;g.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.8,12,10),new THREE.MeshStandardMaterial({color:0x24683a}));crown.position.y=3.4;g.add(crown);g.position.set(x,0,z);g.traverse(o=>{o.castShadow=true});scene.add(g)}[[-27,8],[-23,15],[-7,25],[4,25],[25,17],[29,8],[28,22],[-27,-23],[26,-24],[0,-24]].forEach(p=>tree(...p));
let money=650,lives=100,round=1,running=false,selected=null,towers=[],enemies=[],shots=[],spawnLeft=0,spawnTimer=0;const costs={blaster:200,rapid:350,cannon:500};const stats={blaster:{range:8,damage:1,rate:.55,color:0x2388dc},rapid:{range:7,damage:1,rate:.25,color:0xf28c38},cannon:{range:10,damage:4,rate:1.15,color:0x8c5bd6}};
function goobModel(color,scale){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.85,20,14),new THREE.MeshStandardMaterial({color,roughness:.5}));b.scale.set(1,.9,1);g.add(b);for(const x of[-.27,.27]){const e=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),new THREE.MeshStandardMaterial({color:0xffffff}));e.position.set(x,.2,.72);g.add(e)}g.scale.setScalar(scale);g.traverse(o=>o.castShadow=true);return g}function towerModel(type){const s=stats[type],g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.45,.65,16),new THREE.MeshStandardMaterial({color:0x263746}));g.add(base);const body=new THREE.Mesh(new THREE.SphereGeometry(.85,18,12),new THREE.MeshStandardMaterial({color:s.color}));body.position.y=.8;g.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.7,12),new THREE.MeshStandardMaterial({color:0x151c25,metalness:.5}));barrel.rotation.z=Math.PI/2;barrel.position.set(.85,1.05,0);g.add(barrel);g.userData={type,range:s.range,damage:s.damage,rate:s.rate,cool:0};g.traverse(o=>o.castShadow=true);return g}
function place(p){if(!selected||p.userData.occupied||money<costs[selected])return;money-=costs[selected];const t=towerModel(selected);t.position.set(p.position.x,1.2,p.position.z);t.userData.pad=p;p.userData.occupied=true;p.material.color.setHex(0x48515a);scene.add(t);towers.push(t);selected=null;document.querySelectorAll('.tower').forEach(b=>b.classList.remove('selected'));hud()}
function pathAt(t){return curve.getPoint(Math.max(0,Math.min(1,t)))}function spawn(){const hp=5+round*1.7;const e=goobModel(round%3===0?0xffc34d:0xef5367,1);e.position.copy(pathAt(0));e.position.y=2.1;e.userData={t:0,hp,max:hp,speed:.055+round*.002};scene.add(e);enemies.push(e)}function shoot(t,target){const s=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),new THREE.MeshBasicMaterial({color:0xffef70}));s.position.copy(t.position);s.userData={target,damage:t.userData.damage,speed:25};scene.add(s);shots.push(s)}
function hud(){document.getElementById('money').textContent=Math.max(0,Math.floor(money));document.getElementById('lives').textContent=lives;document.getElementById('round').textContent=round;document.getElementById('enemies').textContent=enemies.length;document.getElementById('status').textContent=selected?'Selected '+selected.toUpperCase()+' — click a green pad.':'Choose a tower.'}function finish(title,text){running=false;document.getElementById('msgTitle').textContent=title;document.getElementById('msgText').textContent=text;document.getElementById('msg').style.display='block'}function newRound(){if(running)return;running=true;spawnLeft=7+round*2;spawnTimer=0;document.getElementById('start').textContent='ROUND RUNNING'}document.getElementById('start').onclick=newRound;document.getElementById('restart').onclick=()=>location.reload();document.querySelectorAll('.tower').forEach(b=>b.onclick=()=>{selected=b.dataset.t;document.querySelectorAll('.tower').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');hud()});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let dragging=false,dragMoved=false,lx=0,ly=0,yaw=.62,pitch=.68,dist=48;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;dragMoved=false;lx=e.clientX;ly=e.clientY});addEventListener('pointermove',e=>{if(!dragging)return;if(Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly)>5)dragMoved=true;yaw-=(e.clientX-lx)*.008;pitch=Math.max(.28,Math.min(1.2,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});addEventListener('pointerup',e=>{if(!dragMoved){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pads)[0];if(hit)place(hit.object)}dragging=false});addEventListener('wheel',e=>dist=Math.max(25,Math.min(70,dist+e.deltaY*.04)),{passive:true});
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;if(running){if(spawnLeft>0){spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnLeft--;spawnTimer=.62}}else if(enemies.length===0){money+=100+round*10;round++;running=false;document.getElementById('start').textContent='▶ START ROUND';hud()}}enemies.slice().forEach(e=>{e.userData.t+=e.userData.speed*dt;e.position.copy(pathAt(e.userData.t));e.position.y=2.1;if(e.userData.t>=1){scene.remove(e);enemies.splice(enemies.indexOf(e),1);lives-=5;if(lives<=0)finish('GAME OVER','The Goobs reached the exit.');}});towers.forEach(t=>{t.userData.cool-=dt;if(t.userData.cool<=0){const targets=enemies.filter(e=>e.userData.t<1&&e.position.distanceTo(t.position)<=t.userData.range);if(targets.length){const target=targets.sort((a,b)=>b.userData.t-a.userData.t)[0];t.lookAt(target.position.x,t.position.y,target.position.z);shoot(t,target);t.userData.cool=t.userData.rate}}});shots.slice().forEach(s=>{const target=s.userData.target;if(!target.parent){scene.remove(s);shots.splice(shots.indexOf(s),1);return}const d=target.position.clone().sub(s.position),step=s.userData.speed*dt;if(d.length()<step){target.userData.hp-=s.userData.damage;scene.remove(s);shots.splice(shots.indexOf(s),1);if(target.userData.hp<=0){money+=12+round;scene.remove(target);enemies.splice(enemies.indexOf(target),1)}}else s.position.add(d.normalize().multiplyScalar(step))});camera.position.set(Math.sin(yaw)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*dist);camera.lookAt(0,1,0);hud();renderer.render(scene,camera)}animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();</script></body></html>
