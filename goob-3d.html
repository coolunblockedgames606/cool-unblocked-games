<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goob Tower Defense Deluxe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Segoe UI,sans-serif;background:#07152c;color:white}button{font:inherit;font-weight:900;cursor:pointer;border:0}.menu{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#69dfff 0%,#79b7ff 38%,#426bb3 70%,#17244c 100%);perspective:1000px}.sky{position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 18% 25%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 55% 12%,#fff8 0 1px,transparent 2px);background-size:180px 140px;opacity:.7}.sun{position:absolute;width:230px;height:230px;border-radius:50%;right:9%;top:-55px;background:#ffe978;box-shadow:0 0 80px #fff7}.cloud{position:absolute;width:240px;height:65px;border-radius:60px;background:#ffffffb8;filter:blur(1px);animation:cloud 24s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#ffffffb8}.cloud:before{width:90px;height:90px;left:35px;top:-35px}.cloud:after{width:110px;height:110px;right:30px;top:-50px}.c1{top:22%;left:-260px}.c2{top:38%;left:-500px;transform:scale(.65);animation-duration:31s;animation-delay:-13s}.c3{top:14%;left:-650px;transform:scale(.45);animation-duration:38s;animation-delay:-21s}@keyframes cloud{to{left:110%}}.mountain{position:absolute;bottom:16%;left:-10%;width:120%;height:40%;background:linear-gradient(145deg,#426f96,#1c3158);clip-path:polygon(0 75%,12% 48%,24% 70%,38% 27%,52% 72%,68% 38%,82% 67%,94% 34%,100% 70%,100% 100%,0 100%);transform:translateZ(-100px)}.island{position:absolute;left:50%;bottom:-1%;width:min(1000px,90vw);height:420px;transform:translateX(-50%) rotateX(58deg) rotateZ(-3deg);transform-origin:center bottom;border-radius:48%;background:linear-gradient(155deg,#89e66d,#3ba95d 5 (1.15);animation-delay:-1.2s}.g3{right:28%;bottom:34%;background:linear-gradient(145deg,#adff7b,#39a95c);transform:scale(1.08);animation-delay:-.8s}.g4{right:12%;bottom:26%;background:linear-gradient(145deg,#f7a8ff,#7e55cf);transform:scale(.9);animation-delay:-1.7s}@keyframes bob{50%{margin-top:-18px;rotate:3deg}}.cardbar{position:absolute;z-index:30;bottom:5%;left:50%;transform:translateX(-50%);display:flex;gap:12px}.card{width:135px;height:76px;border:3px solid #fff;border-radius:15px;padding:9px;color:#fff;text-align:left;box-shadow:0 8px 0 #17265f99;transform:rotateX(12deg);transition:.2s;overflow:hidden}.card:hover{transform:rotateX(0) translateY(-7px)}.card b{font-size:15px;text-shadow:0 2px 4px #000}.card small{display:block;margin-top:5px}.garden{background:linear-gradient(#64df83,#2780a7)}.candy{background:linear-gradient(#ff91c9,#ad4e91)}.space{background:linear-gradient(#4631a1,#111b4a)}.volcano{background:linear-gradient(#ed7048,#662c38)}.hidden{display:none!important}.game{position:fixed;inset:0;background:#07152c;z-index:50}.game iframe{width:100%;height:100%;border:0}.back{position:absolute;z-index:60;top:12px;left:12px;padding:9px 14px;border-radius:12px;background:#ffe15b;color:#563300;box-shadow:0 5px 0 #a96d18}.fx{position:absolute;inset:0;pointer-events:none;z-index:5}.fx i{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff8;animation:float 8s linear infinite}.fx i:nth-child(1){left:12%;top:70%;animation-delay:-2s}.fx i:nth-child(2){left:39%;top:35%;animation-delay:-6s}.fx i:nth-child(3){left:71%;top:64%;animation-delay:-4s}.fx i:nth-child(4){left:88%;top:45%;animation-delay:-7s}@keyframes float{50%{transform:translateY(-90px) scale(1.7);opacity:.2}100%{transform:translateY(-180px);opacity:0}}@media(max-width:700px){.cardbar{display:none}.title{top:13%}.goob{transform:scale(.72)}.g2,.g3{transform:scale(.85)}} </style></head><body><div id="menu" class="menu"><div class="sky"></div><div class="sun"></div><div class="cloud c1">
